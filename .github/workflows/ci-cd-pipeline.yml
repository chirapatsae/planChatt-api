name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier
        run: npm run format
      - name: Run tests
        run: npm test
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

  owasp:
    runs-on: ubuntu-latest
    needs: ci
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Start server
        run: npm start &
      - name: Wait for server to be ready
        run: |
          for i in {1..10}; do
            if nc -z localhost 3000; then
              echo "Server is ready";
              break;
            fi;
            echo "Waiting for server...";
            sleep 3;
          done
      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.6.0
        with:
          target: 'http://127.0.0.1.nip.io:3000'
          fail_action: true
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}